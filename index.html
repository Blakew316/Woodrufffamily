<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Install Woodruff Family</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #ffffff; --text: #111111; --dim: #6b6b70; --blue: #0a7aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1c1c1e; --text: #ffffff; --dim: #98989f; --blue: #0a84ff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 17px/1.4 -apple-system, system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 22px; padding: 28px 22px; text-align: center; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { margin: 0; color: var(--dim); }
  a.install { display: block; margin: 22px 0 18px; padding: 16px; border-radius: 14px; background: var(--blue); color: #ffffff;
              font-size: 20px; font-weight: 600; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a.install:active { opacity: 0.7; }
  .small { font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Woodruff Family</h1>
  <p>For the family’s iPhones and iPads.</p>
  <a class="install" href="itms-services://?action=download-manifest&amp;url=https://github.com/Blakew316/Woodrufffamily/releases/download/install-link/manifest.plist">Install</a>
  <p>Tap Install, then Install again when the iPhone asks. The app updates on the Home Screen.</p>
  <p class="small">Nothing happened? Open this page in Safari.</p>
</main>
</body>
</html>
