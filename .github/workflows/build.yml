name: Build apps

on:
  push:
    # Not release: it only ever points at a commit this workflow has built already.
    branches-ignore: [screenshots, release, claude/tv-work]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Ship this commit to every device
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The quick check a release waits for (about a minute): the scripts every Mac runs. The Mac Studio's own build is
  # the real gate: when it fails, nothing is installed anywhere. The full build below still runs for the record.
  # On Linux: it starts at once (GitHub's Mac machines can keep a job waiting for minutes).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The Python every Mac runs the updater with (Apple's /usr/bin/python3, 3.9), not Ubuntu's newer one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Script tests
        run: bash -n scripts/deploy.sh && python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Script tests
        # macOS's own bash 3.2 and Apple's python3, which the family's Macs run these scripts with.
        run: /bin/bash -n scripts/deploy.sh && /usr/bin/python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version
      - name: WoodruffKit tests
        working-directory: Packages/WoodruffKit
        run: swift test
      - name: Generate project
        run: |
          brew install xcodegen
          scripts/fetch_webrtc.sh
          xcodegen generate
      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project WoodruffFamily.xcodeproj -scheme WoodruffFamily \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build | xcbeautify
      - name: Build iOS app (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project WoodruffFamily.xcodeproj -scheme WoodruffFamily \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | xcbeautify
          mkdir -p out/Payload && cp -R "build/Build/Products/Release-iphoneos/Woodruff Family.app" out/Payload/
          (cd out && zip -qr WoodruffFamily-unsigned.ipa Payload)
      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild -project WoodruffFamily.xcodeproj -scheme WoodruffFamilyMac \
            -destination 'platform=macOS' -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build | xcbeautify
          (cd build/Build/Products/Release && ditto -c -k --keepParent "Woodruff Family.app" "$GITHUB_WORKSPACE/out/WoodruffFamily-mac.zip")
      - name: Build Apple TV app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project WoodruffFamily.xcodeproj -scheme WoodruffFamilyTV \
            -destination 'generic/platform=tvOS Simulator' -configuration Debug \
            -derivedDataPath build-tv CODE_SIGNING_ALLOWED=NO build | xcbeautify
          # The DTS and Dolby TrueHD decoder is in the app, where the app looks for it, and linked weakly (the app
          # must start without it too).
          app="build-tv/Build/Products/Debug-appletvsimulator/Woodruff Family.app"
          test -f "$app/Frameworks/FilmSound.framework/FilmSound"
          loads="$(for f in "$app"/*; do if [ -f "$f" ] && file "$f" | grep -q Mach-O; then otool -l "$f"; fi; done)"
          echo "$loads" | grep -A2 LC_LOAD_WEAK_DYLIB | grep FilmSound
          echo "$loads" | grep -A2 LC_RPATH | grep "@executable_path/Frameworks"
      - name: Build Mac Apple Home helper (Mac Catalyst)
        run: |
          set -o pipefail
          xcodebuild -project WoodruffFamily.xcodeproj -scheme WoodruffHomeHelper \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -configuration Release \
            -derivedDataPath build-helper CODE_SIGNING_ALLOWED=NO build | xcbeautify
      - uses: actions/upload-artifact@v4
        with:
          name: WoodruffFamily-apps
          path: |
            out/WoodruffFamily-unsigned.ipa
            out/WoodruffFamily-mac.zip

  # Ships a commit once it has built: moves the release branch, which every Mac's updater (scripts/updater.py)
  # follows, to it. A push to claude/native-apps whose newest commit has [release] in its message does this, and so
  # does Run workflow with "Ship this commit to every device" ticked. It only ever fast-forwards; going back to an
  # older build is a force-push by hand.
  release:
    needs: check
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/claude/native-apps' &&
      contains(github.event.head_commit.message, '[release]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/claude/native-apps')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release to this commit
        run: |
          set -euo pipefail
          sha=$GITHUB_SHA
          build=$(git rev-list --count "$sha")
          subject=$(git log -1 --format=%s "$sha")
          if git ls-remote --exit-code origin refs/heads/release >/dev/null; then
            git fetch --no-tags origin +refs/heads/release:refs/remotes/origin/release
            current=$(git rev-parse refs/remotes/origin/release)
            # A newer release (its run finished first) already has this commit, or this commit is released already.
            if git merge-base --is-ancestor "$sha" "$current"; then
              echo "release is at $current, which already has $sha: nothing to do."
              echo "Already released: release is at $current, which has $sha." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Couldn't list origin's branches (git ls-remote exited with $status)."
              echo "Not released: couldn't list origin's branches." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "origin has no release branch yet: this makes it."
          fi
          # Never --force: if release has commits this one doesn't, GitHub refuses the push and nothing moves.
          if ! git push origin "$sha:refs/heads/release" 2>&1 | tee "$RUNNER_TEMP/push.log"; then
            if grep -q 'without .workflows. permission' "$RUNNER_TEMP/push.log"; then
              why="GitHub won't let this job's token move release past a change to .github/workflows."
              why="$why The commit built, so move release by hand, without --force: git push origin $sha:release"
            else
              why="release wasn't moved to $sha (see the log above). If it isn't a fast-forward, release has commits"
              why="$why this one doesn't: check them before moving it by hand (git push --force origin $sha:release)."
            fi
            echo "::error::$why"
            echo "Not released: $why" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Released $sha (build $build): $subject"
          {
            echo "Released $sha"
            echo
            echo "Build $build: $subject"
          } >> "$GITHUB_STEP_SUMMARY"
