name: WoodruffFamily
options:
  bundleIdPrefix: com.woodruff.family
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  WoodruffKit:
    path: Packages/WoodruffKit

targets:
  WoodruffFamily:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
      - App/Common
      - App/Resources
    dependencies:
      - package: WoodruffKit
      - target: WoodruffWidgets
    settings:
      base:
        # Set WOODRUFF_BUNDLE_ID on the command line to sign with your own id; the widgets follow it.
        WOODRUFF_BUNDLE_ID: com.woodruff.family.remote
        PRODUCT_BUNDLE_IDENTIFIER: $(WOODRUFF_BUNDLE_ID)
        # Apple Home (Cync over Matter). If signing ever refuses HomeKit, build with
        # WOODRUFF_HOMEKIT=NO WOODRUFF_ENTITLEMENTS= and everything else still works.
        WOODRUFF_HOMEKIT: "YES"
        WOODRUFF_ENTITLEMENTS: App/iOS/WoodruffFamily.entitlements
        CODE_SIGN_ENTITLEMENTS: $(WOODRUFF_ENTITLEMENTS)
        PRODUCT_NAME: Woodruff Family
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Woodruff finds and controls the family’s TVs, Sonos speakers and lights on your Wi-Fi.
        NSBonjourServices: [_woodruff._tcp, _sonos._tcp, _woodruffsync._tcp]
        NSCameraUsageDescription: Scan the pairing QR code shown on a TV.
        NSPhotoLibraryUsageDescription: Add photos and videos to Family Memories on the TVs.
        NSPhotoLibraryAddUsageDescription: Save photos from the TV to your library.
        NSUserNotificationsUsageDescription: Alerts when a TV needs attention or a family announcement arrives.
        NSLocationWhenInUseUsageDescription: Your city sets the weather shown on your TVs' Home screens.
        NSHomeKitUsageDescription: Show and control your Apple Home lights, thermostat, locks, plugs and sensors next to your TVs.
        WoodruffHomeKit: $(WOODRUFF_HOMEKIT)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.woodruff.family.alerts]
        NSSupportsLiveActivities: true
        NSUserActivityTypes: [com.woodruff.family.remote]
        CFBundleURLTypes:
          - CFBundleURLName: com.woodruff.family
            CFBundleURLSchemes: [woodruff]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Lock Screen / Dynamic Island Live Activity and Control Center controls.
  WoodruffWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/Widgets
      - App/Common
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: WoodruffKit
    settings:
      base:
        WOODRUFF_BUNDLE_ID: com.woodruff.family.remote
        PRODUCT_BUNDLE_IDENTIFIER: $(WOODRUFF_BUNDLE_ID).widgets
        PRODUCT_NAME: WoodruffWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  WoodruffFamilyMac:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
      - App/MacCommon
      - App/HomeBridge
      - App/Resources
    dependencies:
      - package: WoodruffKit
      - target: WoodruffMacWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodruff.family.mac
        PRODUCT_NAME: Woodruff Family
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: App/macOS/WoodruffFamilyMac.entitlements
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Woodruff Family
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSLocalNetworkUsageDescription: Woodruff finds and controls the family’s TVs, Sonos speakers and lights on your network.
        NSBonjourServices: [_woodruff._tcp, _sonos._tcp, _woodruffsync._tcp]
        NSPhotoLibraryUsageDescription: Add photos and videos to Family Memories on the TVs.
        NSUserActivityTypes: [com.woodruff.family.remote]
        NSLocationUsageDescription: Your city sets the weather shown on your TVs' Home screens.
        NSLocationWhenInUseUsageDescription: Your city sets the weather shown on your TVs' Home screens.
        WoodruffAppGroup: $(TeamIdentifierPrefix)com.woodruff.family
        CFBundleURLTypes:
          - CFBundleURLName: com.woodruff.family
            CFBundleURLSchemes: [woodruff]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Mac only: Apple Home for Woodruff on the Mac. Apple lets only iPad-style (Mac Catalyst) apps use Apple Home
  # on a Mac, so this small helper reads it (with the iPhone app's HomeKit code) and hands it to Woodruff Family
  # for Mac over a private connection on that Mac. Build with -destination 'platform=macOS,variant=Mac Catalyst'.
  WoodruffHomeHelper:
    type: application
    platform: iOS
    sources:
      - App/HomeHelper
      - App/HomeBridge
      - path: App/iOS/HomeKitLights.swift
      - path: App/Shared/HomeDeviceModel.swift
    dependencies:
      - package: WoodruffKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blakew316.woodruff.homehelper
        PRODUCT_NAME: Woodruff Home Helper
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "2,6"
        CODE_SIGN_ENTITLEMENTS: App/HomeHelper/WoodruffHomeHelper.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/HomeHelper/Info.plist
      properties:
        CFBundleDisplayName: Woodruff Home Helper
        LSApplicationCategoryType: public.app-category.utilities
        # No Dock icon: it runs in the background for Woodruff.
        LSUIElement: true
        NSHomeKitUsageDescription: Woodruff on this Mac shows and controls your Apple Home thermostat, lights, locks, plugs and sensors.
        WoodruffHomeKit: "YES"
        UILaunchScreen: {}

  # Desktop and Notification Center widgets for the Mac.
  WoodruffMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - App/MacWidgets
      - App/MacCommon
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: WoodruffKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodruff.family.mac.widgets
        PRODUCT_NAME: WoodruffMacWidgets
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: App/MacWidgets/WoodruffMacWidgets.entitlements
    info:
      path: App/MacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        WoodruffAppGroup: $(TeamIdentifierPrefix)com.woodruff.family
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

schemes:
  WoodruffFamily:
    build:
      targets:
        WoodruffFamily: all
  WoodruffFamilyMac:
    build:
      targets:
        WoodruffFamilyMac: all
  WoodruffHomeHelper:
    build:
      targets:
        WoodruffHomeHelper: all
