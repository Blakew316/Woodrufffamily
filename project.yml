name: WoodruffFamily
options:
  bundleIdPrefix: com.woodruff.family
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    # scripts/deploy.sh stamps each build: CURRENT_PROJECT_VERSION is the branch's commit count (CFBundleVersion, so a
    # newer build has a higher number) and WOODRUFF_COMMIT the commit it was built from (Settings → General shows
    # both). A build from Xcode or CI keeps these: "Build 1".
    CURRENT_PROJECT_VERSION: "1"
    WOODRUFF_COMMIT: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

packages:
  WoodruffKit:
    path: Packages/WoodruffKit
  # The overhead sounds of TrueHD Atmos and DTS:X for the Apple TV's own player (its README says what it's made of).
  FilmHeights:
    path: Packages/FilmHeights
  # Google's WebRTC library, downloaded into Packages/WebRTC by scripts/fetch_webrtc.sh before each build.
  WebRTC:
    path: Packages/WebRTC

targets:
  WoodruffFamily:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
      - App/Common
      - App/Resources
    dependencies:
      - package: WoodruffKit
      - package: WebRTC
      - target: WoodruffWidgets
      - target: WoodruffNotifications
    settings:
      base:
        # Set WOODRUFF_BUNDLE_ID on the command line to sign with your own id; the widgets follow it.
        WOODRUFF_BUNDLE_ID: com.blakew316.woodruff
        PRODUCT_BUNDLE_IDENTIFIER: $(WOODRUFF_BUNDLE_ID)
        # Apple Home (Cync over Matter). If signing ever refuses HomeKit, build with
        # WOODRUFF_HOMEKIT=NO WOODRUFF_ENTITLEMENTS= and everything else still works.
        WOODRUFF_HOMEKIT: "YES"
        # With the widgets' app group; App/iOS/WoodruffFamilyBasic.entitlements is the same without it.
        WOODRUFF_ENTITLEMENTS: App/iOS/WoodruffFamily.entitlements
        CODE_SIGN_ENTITLEMENTS: $(WOODRUFF_ENTITLEMENTS)
        PRODUCT_NAME: Woodruff Family
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        # XcodeGen writes "1" here otherwise; the widgets carry the same number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WoodruffCommit: $(WOODRUFF_COMMIT)
        LSApplicationCategoryType: public.app-category.utilities
        # Only standard encryption (HTTPS): TestFlight then doesn't ask about export compliance on every build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Woodruff finds and controls the family’s TVs, Sonos speakers and lights on your Wi-Fi.
        NSBonjourServices: [_woodruff._tcp, _sonos._tcp, _woodruffsync._tcp, _woodruffatv._tcp]
        NSCameraUsageDescription: Scan the pairing QR code shown on a TV.
        NSPhotoLibraryUsageDescription: Add photos and videos to Family Memories on the TVs.
        NSPhotoLibraryAddUsageDescription: Save photos from the TV to your library.
        NSUserNotificationsUsageDescription: Alerts when a TV needs attention or a family announcement arrives.
        NSLocationWhenInUseUsageDescription: Your city sets the weather shown on your TVs' Home screens.
        NSHomeKitUsageDescription: Show and control your Apple Home lights, thermostat, locks, plugs and sensors next to your TVs.
        WoodruffHomeKit: $(WOODRUFF_HOMEKIT)
        # remote-notification: a camera's alert wakes the app for a few seconds to keep the event's picture and clip.
        UIBackgroundModes: [fetch, audio, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.woodruff.family.alerts, com.woodruff.family.widgets]
        NSSupportsLiveActivities: true
        NSUserActivityTypes: [com.woodruff.family.remote]
        CFBundleURLTypes:
          - CFBundleURLName: com.woodruff.family
            CFBundleURLSchemes: [woodruff]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Lock Screen / Dynamic Island Live Activity and Control Center controls.
  WoodruffWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/Widgets
      - App/Common
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: WoodruffKit
    settings:
      base:
        WOODRUFF_BUNDLE_ID: com.blakew316.woodruff
        PRODUCT_BUNDLE_IDENTIFIER: $(WOODRUFF_BUNDLE_ID).widgets
        PRODUCT_NAME: WoodruffWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        # The app group shared with the app, and push for the camera widgets (the Mac Studio's push after an alert from
        # a camera they show). App/Widgets/WoodruffWidgets.entitlements: the app group alone; empty: none.
        WOODRUFF_WIDGET_ENTITLEMENTS: App/Widgets/WoodruffWidgetsPush.entitlements
        CODE_SIGN_ENTITLEMENTS: $(WOODRUFF_WIDGET_ENTITLEMENTS)
        SKIP_INSTALL: YES
    info:
      path: App/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        # The same build number as the app around it.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Camera and doorbell pushes: fetches the event's clip or snapshot and puts it in the notification.
  WoodruffNotifications:
    type: app-extension
    platform: iOS
    sources:
      - App/NotificationService
      - path: App/Shared/CameraEventMedia.swift
      # Frames the alert's small picture on who or what was seen (Vision).
      - path: App/Shared/SubjectCrop.swift
      # Makes a washed-out or dark alert picture clear (the close-up and the widgets' still made here).
      - path: App/Shared/PictureTone.swift
      # The TVs & Cameras widget's store: each camera alert's picture goes to the widget too.
      - path: App/Common/PhoneWidgetShare.swift
    settings:
      base:
        WOODRUFF_BUNDLE_ID: com.blakew316.woodruff
        PRODUCT_BUNDLE_IDENTIFIER: $(WOODRUFF_BUNDLE_ID).notifications
        PRODUCT_NAME: WoodruffNotifications
        TARGETED_DEVICE_FAMILY: "1,2"
        # The app group shared with the app (empty: none; the Mac's picture in the push still shows then).
        WOODRUFF_NOTIFY_ENTITLEMENTS: App/NotificationService/WoodruffNotifications.entitlements
        CODE_SIGN_ENTITLEMENTS: $(WOODRUFF_NOTIFY_ENTITLEMENTS)
        SKIP_INSTALL: YES
    info:
      path: App/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        # The Mac Studio's full picture of each event, over plain HTTP on its home or Tailscale address.
        NSLocalNetworkUsageDescription: Woodruff gets each camera alert's picture from the family's Mac on your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Apple TV: its own screens for the Siri Remote, on the shared WoodruffKit (no iPhone or Mac code).
  WoodruffFamilyTV:
    type: application
    platform: tvOS
    sources:
      - App/TV
      # The iPhone app's own screens and everything behind them, laid out for the TV (App/TV/TVCompat.swift has the
      # Apple TV versions of the few iPhone-only pieces). Not the WebRTC camera player: there's no WebRTC for tvOS.
      - path: App/Shared
        excludes: [NativeCamera.swift, CameraSound.swift, Notifier.swift]
      # Apple Home (the iPhone app's own code: HomeKit is on tvOS too): its lights, thermostat, locks and sensors.
      - path: App/iOS/HomeKitLights.swift
      # The sample family's pictures (-demo YES), for the screenshot run.
      - path: App/Resources/Demo
    dependencies:
      - package: WoodruffKit
      - package: FilmHeights
      # The decoders for DTS and Dolby TrueHD sound, which the Apple TV has none for (Packages/FilmSound, built by
      # scripts/build_filmsound.sh from FFmpeg's; App/TV/TVFilmSound.swift). Linked weakly: a build it's missing
      # from would still start, and such sound then can't be played, as before there was a decoder.
      - framework: Packages/FilmSound/FilmSound.xcframework
        embed: true
        weak: true
      # The Top Shelf slideshow (the iCloud album picked in Settings).
      - target: WoodruffFamilyTVTopShelf
        embed: true
    entitlements:
      path: App/TV/WoodruffFamilyTV.entitlements
      properties:
        com.apple.security.application-groups: [group.com.blakew316.woodruff.tv]
        # Apple Home. Xcode's signing on the Mac Studio turns the capability on for the app's identifier by itself.
        com.apple.developer.homekit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blakew316.woodruff.tv
        PRODUCT_NAME: Woodruff Family
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        # Where the app finds FilmSound.framework when it starts.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # LibTrueHD has no library for an Intel Mac's Apple TV simulator.
        "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
    info:
      path: App/TV/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WoodruffCommit: $(WOODRUFF_COMMIT)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Woodruff finds and controls the family’s TVs, Sonos speakers and lights on your network.
        NSLocationWhenInUseUsageDescription: Woodruff shows the weather where you are on Home.
        NSPhotoLibraryUsageDescription: Woodruff shows the album you pick as a slideshow on the Top Shelf.
        NSHomeKitUsageDescription: Show and control your Apple Home lights, thermostat, locks, plugs and sensors next to your TVs.
        WoodruffHomeKit: "YES"
        # The Top Shelf's photos open the app (woodruff://home).
        CFBundleURLTypes:
          - CFBundleURLName: com.blakew316.woodruff.tv
            CFBundleURLSchemes: [woodruff]
        NSBonjourServices: [_woodruff._tcp, _sonos._tcp, _woodruffsync._tcp, _woodruffatv._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Apple TV's Top Shelf: the picked iCloud album as a slideshow above Woodruff's icon on the Home Screen.
  WoodruffFamilyTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - App/TVTopShelf
    entitlements:
      path: App/TVTopShelf/WoodruffFamilyTVTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.blakew316.woodruff.tv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blakew316.woodruff.tv.topshelf
        PRODUCT_NAME: WoodruffTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: App/TVTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Woodruff Top Shelf
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: ContentProvider

  WoodruffFamilyMac:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
      - App/MacCommon
      - App/HomeBridge
      - App/Resources
    dependencies:
      - package: WoodruffKit
      - package: WebRTC
      - target: WoodruffMacWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodruff.family.mac
        PRODUCT_NAME: Woodruff Family
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: App/macOS/WoodruffFamilyMac.entitlements
    info:
      path: App/macOS/Info.plist
      properties:
        CFBundleDisplayName: Woodruff Family
        # XcodeGen writes "1" here otherwise; the widgets carry the same number.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WoodruffCommit: $(WOODRUFF_COMMIT)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSLocalNetworkUsageDescription: Woodruff finds and controls the family’s TVs, Sonos speakers and lights on your network.
        NSBonjourServices: [_woodruff._tcp, _sonos._tcp, _woodruffsync._tcp, _woodruffatv._tcp]
        NSPhotoLibraryUsageDescription: Add photos and videos to Family Memories on the TVs.
        NSUserActivityTypes: [com.woodruff.family.remote]
        NSLocationUsageDescription: Your city sets the weather shown on your TVs' Home screens.
        NSLocationWhenInUseUsageDescription: Your city sets the weather shown on your TVs' Home screens.
        WoodruffAppGroup: $(TeamIdentifierPrefix)com.woodruff.family
        CFBundleURLTypes:
          - CFBundleURLName: com.woodruff.family
            CFBundleURLSchemes: [woodruff]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

  # Mac only: Apple Home for Woodruff on the Mac. Apple lets only iPad-style (Mac Catalyst) apps use Apple Home
  # on a Mac, so this small helper reads it (with the iPhone app's HomeKit code) and hands it to Woodruff Family
  # for Mac over a private connection on that Mac. Build with -destination 'platform=macOS,variant=Mac Catalyst'.
  WoodruffHomeHelper:
    type: application
    platform: iOS
    sources:
      - App/HomeHelper
      - App/HomeBridge
      - path: App/iOS/HomeKitLights.swift
      - path: App/Shared/HomeDeviceModel.swift
    dependencies:
      - package: WoodruffKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blakew316.woodruff.homehelper
        PRODUCT_NAME: Woodruff Home Helper
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "2,6"
        CODE_SIGN_ENTITLEMENTS: App/HomeHelper/WoodruffHomeHelper.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/HomeHelper/Info.plist
      properties:
        CFBundleDisplayName: Woodruff Home Helper
        LSApplicationCategoryType: public.app-category.utilities
        # No Dock icon: it runs in the background for Woodruff.
        LSUIElement: true
        NSHomeKitUsageDescription: Woodruff on this Mac shows and controls your Apple Home thermostat, lights, locks, plugs and sensors.
        WoodruffHomeKit: "YES"
        UILaunchScreen: {}

  # Desktop and Notification Center widgets for the Mac.
  WoodruffMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - App/MacWidgets
      - App/MacCommon
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: WoodruffKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodruff.family.mac.widgets
        PRODUCT_NAME: WoodruffMacWidgets
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: App/MacWidgets/WoodruffMacWidgets.entitlements
    info:
      path: App/MacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Woodruff
        # The same build number as the app around it.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WoodruffAppGroup: $(TeamIdentifierPrefix)com.woodruff.family
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

schemes:
  WoodruffFamily:
    build:
      targets:
        WoodruffFamily: all
  WoodruffFamilyMac:
    build:
      targets:
        WoodruffFamilyMac: all
  WoodruffHomeHelper:
    build:
      targets:
        WoodruffHomeHelper: all
  WoodruffFamilyTV:
    build:
      targets:
        WoodruffFamilyTV: all
